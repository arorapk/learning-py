[project]
name = "learning-py"
version = "0.1.0"
description = "Learning Python to a shippable standard."
readme = "README.md"
authors = [
    { name = "arorap", email = "103939783+arorapk@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
learning-py = "learning_py:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes — real bugs
    "I",      # isort — import ordering
    "N",      # pep8-naming
    "UP",     # pyupgrade — modernise old syntax
    "B",      # flake8-bugbear — likely bugs
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations — MISSING TYPE HINTS
    "RUF",    # ruff's own rules
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
